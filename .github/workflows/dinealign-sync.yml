name: DineAlign offers sync

on:
  schedule:
    # GitHub cron is UTC. These two are 10:00 and 19:00 IST.
    - cron: '30 4 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch: {}

concurrency:
  group: dinealign-offers-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch Zomato and Swiggy Dineout, upsert Supabase
        run: npm run dinealign
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_TABLE: ${{ vars.SUPABASE_TABLE || 'restaurants' }}
          PROXY_LIST: ${{ secrets.PROXY_LIST }}
          ALLOW_DIRECT: ${{ vars.ALLOW_DIRECT || 'true' }}
          MAX_PAGES: ${{ vars.MAX_PAGES || '3' }}
          MIN_DELAY_MS: ${{ vars.MIN_DELAY_MS || '10000' }}
          MAX_DELAY_MS: ${{ vars.MAX_DELAY_MS || '15000' }}
          PROXY_MIN_GAP_MS: ${{ vars.PROXY_MIN_GAP_MS || '10000' }}

      - name: Upload scraped JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dinealign-restaurants
          path: output/dinealign.json
          if-no-files-found: ignore
          retention-days: 7
